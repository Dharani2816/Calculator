<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <p class="h1 text-center m-2 mb-5">Responsive Calculator</p>
    <div id="calculator" class="container mx-auto mt-5  p-1 border border-dark rounded bg-dark">
        <div class="row">
            <div class="col-12 my-1 mx-auto">
                <input type="text" id="output" class="form-control border-dark bg-secondary text-end fs-2" readonly>
            </div>
        </div>
        <div class="row my-1 g-0">
            <div class="col-3 p-1"><button onclick="append('1')" class="btn btn-primary p-2 fs-3 w-100 rounded-pill">1</button></div>
            <div class="col-3 p-1"><button onclick="append('2')" class="btn btn-primary p-2 fs-3 w-100 rounded-pill">2</button></div>
            <div class="col-3 p-1"><button onclick="append('3')" class="btn btn-primary p-2 fs-3 w-100 rounded-pill">3</button></div>
            <div class="col-3 p-1"><button onclick="append('+')" class="btn btn-info p-2  fs-3 w-100  rounded-pill">+</button></div>
        </div>
        <div class="row my-1 g-0">
            <div class="col-3 p-1"><button onclick="append('4')" class="btn btn-primary fs-3 w-100 rounded-pill">4</button></div>
            <div class="col-3 p-1"><button onclick="append('5')" class="btn btn-primary  fs-3 w-100 rounded-pill">5</button></div>
            <div class="col-3 p-1"><button onclick="append('6')" class="btn btn-primary fs-3 w-100 rounded-pill">6</button></div>
            <div class="col-3 p-1"><button onclick="append('-')" class="btn btn-info  fs-3  w-100 rounded-pill">-</button></div>
        </div>
        <div class="row my-1 g-0">
            <div class="col-3 p-1"><button onclick="append('7')" class="btn btn-primary fs-3 w-100 rounded-pill">7</button></div>
            <div class="col-3 p-1"><button onclick="append('8')" class="btn btn-primary  fs-3 w-100 rounded-pill">8</button></div>
            <div class="col-3 p-1"><button onclick="append('9')" class="btn btn-primary  fs-3 w-100 rounded-pill">9</button></div>
            <div class="col-3 p-1"><button onclick="append('*')" class="btn btn-info fs-3 w-100 rounded-pill">*</button></div>
        </div>
        <div class="row my-1 g-0">
            <div class="col-3 p-1"><button onclick="append('0')" class="btn btn-primary fs-3 w-100 rounded-pill">0</button></div>
            <div class="col-3 p-1"><button onclick="append('.')" class="btn btn-primary fs-3 w-100 rounded-pill">.</button></div>
            <div class="col-3 p-1"><button onclick = "evaluateAns()"class="btn btn-success fs-3 w-100 rounded-pill">=</button></div>
            <div class="col-3 p-1"><button onclick="append('/')" class="btn btn-info fs-3 w-100 rounded-pill">/</button></div>
        </div>
        <div class="row my-1 g-0">
            <div class="col-12 p-1"><button onclick = "clearOutput()" class="btn btn-danger fs-3 w-100 rounded-pill">C</button></div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
